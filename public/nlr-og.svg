<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#070F16"/>
  <!-- Green gradient panel -->
  <rect x="0" y="0" width="480" height="630" fill="#1A7A3C" opacity="0.85"/>
  <!-- Grid overlay -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#C9A84C" stroke-width="0.4" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Gold accent bar -->
  <rect x="480" y="0" width="6" height="630" fill="#C9A84C"/>
  <!-- NLR logo block -->
  <rect x="60" y="60" width="100" height="100" fill="#C9A84C"/>
  <text x="110" y="130" font-family="Arial Black, sans-serif" font-size="36" font-weight="900" fill="#070F16" text-anchor="middle">NLR</text>
  <!-- Headline -->
  <text x="560" y="210" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">NEXT LEVEL</text>
  <text x="560" y="290" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" fill="#C9A84C" text-anchor="middle" letter-spacing="4">RECRUITING</text>
  <!-- Tagline -->
  <text x="560" y="360" font-family="Arial, sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle" opacity="0.75">Your Game. Your Future. Next Level.</text>
  <!-- Gold separator -->
  <rect x="460" y="390" width="200" height="3" fill="#C9A84C"/>
  <!-- Description -->
  <text x="560" y="440" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle" opacity="0.6">Highlight Tapes · Film Breakdowns · Recruiting Profiles</text>
  <text x="560" y="470" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle" opacity="0.6">College Consulting · 10 Sports · All Ages · SoCal</text>
  <!-- Phone -->
  <text x="560" y="540" font-family="Arial, sans-serif" font-size="20" fill="#C9A84C" text-anchor="middle" font-weight="bold">(818) 521-7493 · @NLRAthletes</text>
  <!-- Left panel text -->
  <text x="240" y="340" font-family="Arial Black, sans-serif" font-size="28" fill="#FFFFFF" text-anchor="middle" opacity="0.9">10 SPORTS</text>
  <text x="240" y="390" font-family="Arial Black, sans-serif" font-size="28" fill="#FFFFFF" text-anchor="middle" opacity="0.9">ALL AGES</text>
  <text x="240" y="440" font-family="Arial Black, sans-serif" font-size="28" fill="#FFFFFF" text-anchor="middle" opacity="0.9">SO CAL</text>
</svg>
